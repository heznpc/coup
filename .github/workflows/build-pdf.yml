name: Build paper PDF

on:
  push:
    branches: [main]
    paths:
      - "paper/**"
      - "CITATION.cff"
      - ".zenodo.json"
      - ".github/workflows/build-pdf.yml"
  pull_request:
    paths:
      - "paper/**"
      - "CITATION.cff"
      - ".zenodo.json"
      - ".github/workflows/build-pdf.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs only on PR iterations; never cancel a main-branch
  # build, so every merged commit keeps its own PDF artifact + build record.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Compile main.tex
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: paper
          root_file: main.tex
          latexmk_use_xelatex: false
          latexmk_use_lualatex: false
          continue_on_error: false

      - name: Upload PDF artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: coup-main-pdf
          path: paper/main.pdf
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coup-build-logs
          path: |
            paper/main.log
            paper/main.aux
            paper/main.blg
            paper/main.bbl
          if-no-files-found: ignore
          retention-days: 7

  validate-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install validators
        run: pip install cffconvert pyyaml

      - name: Validate CITATION.cff against the CFF schema
        run: cffconvert --validate -i CITATION.cff

      - name: Validate .zenodo.json is well-formed JSON
        run: python3 -m json.tool .zenodo.json > /dev/null

      - name: Check abstract and Zenodo description stay in sync
        run: |
          python3 - <<'PY'
          import json, sys, yaml
          cff = yaml.safe_load(open("CITATION.cff"))
          zen = json.load(open(".zenodo.json"))
          abstract = " ".join((cff.get("abstract") or "").split())
          description = " ".join((zen.get("description") or "").split())
          if abstract != description:
              print("::error::CITATION.cff 'abstract' and .zenodo.json 'description' have drifted; edit paper/main.tex first, then mirror both.")
              print("abstract   :", abstract[:160])
              print("description:", description[:160])
              sys.exit(1)
          print("abstract and Zenodo description are in sync")
          PY
